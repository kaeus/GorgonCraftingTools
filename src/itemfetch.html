<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hire a Fetcher - CraftingCorner</title>
  <link rel="stylesheet" href="./css/itemform.css">
  <link rel="stylesheet" href="./css/fantasy-dropdown.css">
  <style>
    body { visibility: hidden; background-color: #000; }
    #global-loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 9999; }
  </style>
  <script type="module" src="./js/main.js"></script>
</head>
<body>

<!-- ── Global Loading Overlay ── -->
<div id="global-loading-overlay"></div>

<div class="topbar"></div>

<div class="form-page">
  <h1 class="form-page-title">Hire a Fetcher</h1>
  <p class="form-page-subtitle">Find someone to acquire rare and hard-to-find items</p>

  <div id="divider-container"></div>
  <div id="status" class="status-bar loading">Loading…</div>

  <div class="form-container" id="form-wrapper">
    <img src="" alt="nail" class="form-nail" id="form-nail">
    
    <h3 class="form-title">Hire a Fetcher</h3>
    <p class="form-subtitle">Find someone to acquire rare and hard-to-find items for you.</p>

    <form id="fetcher-listing-form">
      <div class="form-group">
        <label for="fetcher-character-name">Character Name *</label>
        <input type="text" id="fetcher-character-name" placeholder="Your character name" required>
      </div>
      
      <div class="form-group">
        <label for="fetcher-server">Server *</label>
        <select id="fetcher-server" required>
          <option value="">Select a server</option>
          <option value="Arisetsu">Arisetsu</option>
          <option value="Dreva">Dreva</option>
          <option value="Laeth">Laeth</option>
          <option value="Miraverre">Miraverre</option>
          <option value="Strekios">Strekios</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="fetcher-pst">Availability</label>
        <input type="text" id="fetcher-pst" placeholder="e.g. 6 PM - 10 PM">
      </div>
      
      <div class="form-group">
        <label for="fetcher-commission">Commission Rate % *</label>
        <input type="number" id="fetcher-commission" min="0" max="100" step="1" value="50" required>
      </div>
      
      <div class="form-group">
        <label for="fetcher-notes">Description</label>
        <textarea id="fetcher-notes" placeholder="Tell potential clients what you specialize in or any terms..."></textarea>
      </div>
      
      <div class="form-error" id="fetcher-form-error"></div>
      
      <div class="form-buttons">
        <button type="submit" id="fetcher-submit-btn" disabled>Create Listing</button>
        <button type="button" onclick="window.location.href='yourListings.html'">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>

<script>
  // Auto-populate server dropdown from sidebar selection
  document.addEventListener('DOMContentLoaded', () => {
    const selectedServer = localStorage.getItem('selectedServer');
    if (selectedServer) {
      const serverSelect = document.getElementById('fetcher-server');
      if (serverSelect) {
        serverSelect.value = selectedServer;
      }
    }
  });
</script>

<script type="module">
  import { generateDenseClipPath, getRandomNail, getNailPositionStyle, getCardDishevelStyle } from './js/scroll-edge.js'
  
  document.addEventListener('DOMContentLoaded', () => {
    const formWrapper = document.getElementById('form-wrapper')
    
    if (formWrapper) {
      formWrapper.style.clipPath = generateDenseClipPath()
      formWrapper.style.cssText += getCardDishevelStyle()
      
      const randomX = Math.random() * 100
      const randomY = Math.random() * 100
      formWrapper.style.setProperty('--glass-pos-x', `${randomX}%`)
      formWrapper.style.setProperty('--glass-pos-y', `${randomY}%`)
      formWrapper.style.setProperty('--parchment-pos-x', `${Math.random() * 100}%`)
      formWrapper.style.setProperty('--parchment-pos-y', `${Math.random() * 100}%`)
      
      const nailImg = document.getElementById('form-nail')
      if (nailImg) {
        nailImg.src = getRandomNail()
        nailImg.style.cssText = getNailPositionStyle()
      }
    }
  })
</script>

<script type="module" src="./js/page-item-fetch.js"></script>

</body>
</html>
